<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Vadodara Mahjong League</title>
<link rel="manifest" href="admin-manifest.json" />
<meta name="theme-color" content="#EAF4EA" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4EA;--surface:#F5FAF6;--card:#FFFFFF;--border:#D7E8DA;--gold:#2E9E60;--text:#1B4D2E;--muted:#5B6B5B;--radius:12px;--red:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-family:'Noto Serif Display',serif;font-size:18px;color:var(--gold);}
.header a,.header button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;font-size:11px;text-decoration:none;cursor:pointer;font-family:'Inter',sans-serif;}
.main{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card h2{font-size:14px;margin-bottom:12px;}
.reg-item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.reg-info{font-size:13px;}
.reg-info .name{font-weight:600;}
.reg-info .meta{color:var(--muted);font-size:11px;}
.reg-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-sm{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-approve{background:var(--gold);color:#fff;}
.btn-reject{background:transparent;border:1px solid var(--red);color:var(--red);}
.empty-note{font-size:13px;color:var(--muted);text-align:center;padding:14px 0;}
input[type=text]{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border);}
td{padding:6px 4px;border-bottom:1px solid var(--surface);}
.status-active{color:#1E7A46;font-weight:600;}
.status-expired{color:var(--red);font-weight:600;}
.status-paused{color:#B9770E;font-weight:600;}
.btn-wa{background:#E3F5E8;color:#1E7A46;}
.row-actions{display:flex;gap:4px;flex-wrap:wrap;}
.btn-xs{padding:5px 8px;border-radius:6px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title"><img src="ttml-logo.png" alt="TTML" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px;">Admin</div>
  <div style="display:flex;gap:8px;">
    <a href="dashboard.html">Dashboard</a>
    <button onclick="doLogout()">Log out</button>
  </div>
</div>

<div class="main" id="main" style="display:none;">

  <div class="card">
    <h2>Pending Registrations</h2>
    <div id="pending-list"><div class="empty-note">Loading...</div></div>
  </div>

  <div class="card">
    <h2>Pending Renewals</h2>
    <div id="renewals-list"><div class="empty-note">Loading...</div></div>
  </div>

  <div class="card">
    <h2>Disputed Matches</h2>
    <div id="disputed-list"><div class="empty-note">Loading...</div></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="margin-bottom:0;">Members</h2>
      <button class="btn-xs" style="background:var(--surface);color:var(--text);border:1px solid var(--border);" onclick="downloadMembersCsv()">⬇ Download Excel</button>
    </div>
    <input type="text" id="member-search" placeholder="Search by name, member ID, or mobile" oninput="debouncedSearch()">
    <table>
      <thead><tr><th>Member ID</th><th>Name</th><th>Mobile</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="member-rows"></tbody>
    </table>
  </div>

</div>

<div id="denied" style="display:none;padding:40px 20px;text-align:center;color:var(--muted);">Admin access required.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/vml-common.js"></script>
<script>
var myAdminId = null;

window.addEventListener('DOMContentLoaded', async function () {
  var { data: { session } } = await vmlClient.auth.getSession();
  if (!session) { window.location.href='login.html'; return; }

  var { data } = await vmlClient.rpc('vml_my_profile');
  var profile = data && data[0];
  if (!profile || !profile.is_admin) {
    document.getElementById('denied').style.display = 'block';
    return;
  }
  myAdminId = profile.id;

  document.getElementById('main').style.display = 'block';
  loadPending();
  loadRenewals();
  loadDisputed();
  loadMembers();
});

// India-only assumption (matches every other number already in this app) --
// strips any non-digits and prefixes country code 91 for wa.me links.
// Optional text pre-fills the WhatsApp message (still editable before send,
// never sent automatically).
function waLink(mobile, text) {
  var digits = (mobile || '').replace(/\D/g, '');
  var url = 'https://wa.me/91' + digits.slice(-10);
  if (text) url += '?text=' + encodeURIComponent(text);
  return url;
}

var WA_WELCOME_MSG = 'Welcome to Vadodara Mahjong League, in collaboration with Tea & Tiles Mahjong Lounge! Your membership has been approved, and you can now upload your team\'s scores on the leaderboard.';

async function loadPending() {
  var { data, error } = await vmlClient.rpc('vml_admin_pending_registrations');
  var el = document.getElementById('pending-list');
  if (error) {
    console.error('vml_admin_pending_registrations failed:', error);
    el.innerHTML = '<div class="empty-note" style="color:var(--red);">Error loading pending registrations: ' + error.message + '</div>';
    return;
  }
  var rows = data || [];
  if (!rows.length) { el.innerHTML = '<div class="empty-note">No pending registrations.</div>'; return; }
  el.innerHTML = rows.map(function (r) {
    return '<div class="reg-item">'
      + '<div class="reg-info"><div class="name">' + r.name + '</div><div class="meta">' + r.email + ' · ' + r.mobile + '</div></div>'
      + '<div class="reg-actions">'
      + '<a class="btn-sm btn-wa" href="' + waLink(r.mobile) + '" target="_blank" rel="noopener">WhatsApp</a>'
      + '<button class="btn-sm btn-approve" onclick="approvePlayer(\'' + r.id + '\')">Approve</button>'
      + '<button class="btn-sm btn-reject" onclick="rejectPlayer(\'' + r.id + '\')">Reject</button>'
      + '</div></div>';
  }).join('');
}

async function loadRenewals() {
  var { data, error } = await vmlClient.rpc('vml_admin_pending_renewals');
  var el = document.getElementById('renewals-list');
  if (error) {
    console.error('vml_admin_pending_renewals failed:', error);
    el.innerHTML = '<div class="empty-note" style="color:var(--red);">Error loading pending renewals: ' + error.message + '</div>';
    return;
  }
  var rows = data || [];
  if (!rows.length) { el.innerHTML = '<div class="empty-note">No pending renewals.</div>'; return; }
  el.innerHTML = rows.map(function (r) {
    return '<div class="reg-item">'
      + '<div class="reg-info"><div class="name">' + r.name + ' (' + r.member_id + ')</div><div class="meta">' + r.email + ' · ' + r.mobile + ' · was valid until ' + new Date(r.expires_at).toLocaleDateString('en-IN') + '</div></div>'
      + '<div class="reg-actions">'
      + '<a class="btn-sm btn-wa" href="' + waLink(r.mobile) + '" target="_blank" rel="noopener">WhatsApp</a>'
      + '<button class="btn-sm btn-approve" onclick="approveRenewal(\'' + r.id + '\')">Approve</button>'
      + '</div></div>';
  }).join('');
}

async function approveRenewal(id) {
  var { error } = await vmlClient.rpc('vml_approve_renewal', { p_player_id: id });
  if (error) { alert(error.message); return; }
  alert('Renewal approved — extended 1 year from today.');
  loadRenewals(); loadMembers();
}

async function approvePlayer(id) {
  var { data, error } = await vmlClient.rpc('vml_approve_player', { p_player_id: id });
  if (error) { alert(error.message); return; }
  alert('Approved! Member ID: ' + data);
  loadPending(); loadMembers();
}

async function rejectPlayer(id) {
  if (!confirm('Reject this registration?')) return;
  var { error } = await vmlClient.rpc('vml_reject_player', { p_player_id: id });
  if (error) { alert(error.message); return; }
  loadPending(); loadMembers();
}

async function loadDisputed() {
  var { data, error } = await vmlClient.rpc('vml_admin_rejected_matches');
  var el = document.getElementById('disputed-list');
  if (error) {
    console.error('vml_admin_rejected_matches failed:', error);
    el.innerHTML = '<div class="empty-note" style="color:var(--red);">Error loading disputed matches: ' + error.message + '</div>';
    return;
  }
  var rows = data || [];
  if (!rows.length) { el.innerHTML = '<div class="empty-note">No disputed matches.</div>'; return; }
  el.innerHTML = rows.map(function (r) {
    return '<div class="reg-item">'
      + '<div class="reg-info"><div class="name">' + (r.category === 'traditional' ? '🀄 Traditional' : '🏆 Taiwanese') + ' — ' + r.match_date + ' (code: ' + r.match_code + ')</div>'
      + '<div class="meta">Logged by ' + r.creator_name + (r.rejected_reason ? (' · "' + r.rejected_reason + '"') : '') + '</div></div>'
      + '</div>';
  }).join('');
}

var searchTimer = null;
function debouncedSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadMembers, 300);
}

var lastMemberRows = [];

async function loadMembers() {
  var q = document.getElementById('member-search').value.trim() || null;
  var { data, error } = await vmlClient.rpc('vml_admin_member_list', { p_search: q });
  if (error) {
    console.error('vml_admin_member_list failed:', error);
    document.getElementById('member-rows').innerHTML = '<tr><td colspan="5" style="color:var(--red);">Error: ' + error.message + '</td></tr>';
    return;
  }
  var rows = data || [];
  lastMemberRows = rows;
  var now = new Date();
  document.getElementById('member-rows').innerHTML = rows.map(function (r) {
    var expired = r.expires_at && new Date(r.expires_at) < now;
    var statusLabel = r.status === 'active' ? (expired ? 'Lapsed' : 'Active') : r.status === 'paused' ? 'Paused' : r.status;
    var statusClass = r.status === 'active' && !expired ? 'status-active' : r.status === 'paused' ? 'status-paused' : (expired ? 'status-expired' : '');

    var actions = '<div class="row-actions">';
    actions += '<a class="btn-xs btn-wa" href="' + waLink(r.mobile, WA_WELCOME_MSG) + '" target="_blank" rel="noopener">WA</a>';
    if (r.id === myAdminId) {
      actions += '<span style="font-size:11px;color:var(--muted);">(you)</span>';
    } else if (r.is_admin) {
      actions += '<span style="font-size:11px;color:var(--muted);">(admin)</span>';
    } else {
      if (r.status === 'active') {
        actions += '<button class="btn-xs" style="background:#FDF3E7;color:#B9770E;" onclick="pausePlayer(\'' + r.id + '\',true)">Pause</button>';
      } else if (r.status === 'paused') {
        actions += '<button class="btn-xs" style="background:#E3F5E8;color:#1E7A46;" onclick="pausePlayer(\'' + r.id + '\',false)">Unpause</button>';
      }
      actions += '<button class="btn-xs" style="background:#FBEAEA;color:var(--red);" onclick="deletePlayer(\'' + r.id + '\',\'' + r.name.replace(/'/g, "\\'") + '\')">Delete</button>';
    }
    actions += '</div>';

    return '<tr><td>' + (r.member_id || '-') + '</td><td>' + r.name + '</td><td>' + r.mobile + '</td><td class="' + statusClass + '">' + statusLabel + '</td><td>' + actions + '</td></tr>';
  }).join('');
}

// Plain CSV (opens directly in Excel/Google Sheets) -- no library needed,
// and avoids pulling in an xlsx-writing dependency for one button.
function csvCell(v) {
  var s = (v === null || v === undefined) ? '' : String(v);
  if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadMembersCsv() {
  var header = ['Member ID', 'Name', 'Mobile', 'Email', 'Status', 'Expires At', 'Admin'];
  var lines = [header.map(csvCell).join(',')];
  lastMemberRows.forEach(function (r) {
    lines.push([
      r.member_id || '',
      r.name,
      r.mobile,
      r.email,
      r.status,
      r.expires_at ? new Date(r.expires_at).toLocaleDateString('en-IN') : '',
      r.is_admin ? 'Yes' : ''
    ].map(csvCell).join(','));
  });

  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'vml-members-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function pausePlayer(id, paused) {
  var { error } = await vmlClient.rpc('vml_admin_set_paused', { p_player_id: id, p_paused: paused });
  if (error) { alert(error.message); return; }
  loadMembers();
}

async function deletePlayer(id, name) {
  if (!confirm('Permanently delete ' + name + '\'s membership? This cannot be undone. (Blocked automatically if they have match history.)')) return;
  var { error } = await vmlClient.rpc('vml_admin_delete_player', { p_player_id: id });
  if (error) { alert(error.message); return; }
  loadMembers();
}

async function doLogout() {
  await vmlClient.auth.signOut();
  window.location.href='index.html';
}
</script>
</body>
</html>
