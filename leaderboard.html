<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Vadodara Mahjong League</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#EAF4EA" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4EA;--surface:#F5FAF6;--card:#FFFFFF;--border:#D7E8DA;--gold:#2E9E60;--gold-light:#3FBE79;--text:#1B4D2E;--muted:#5B6B5B;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-family:'Noto Serif Display',serif;font-size:18px;color:var(--gold);}
.header-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.header a{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;font-size:11px;text-decoration:none;}
.main{max-width:480px;margin:0 auto;padding:20px 16px 80px;}
.cat-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:20px;overflow:hidden;}
.cat-tab{flex:1;padding:11px 8px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;text-align:center;}
.cat-tab.active{background:var(--gold);color:#fff;}
.loading{text-align:center;padding:32px;color:var(--muted);font-size:13px;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.6;}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.stat-number{font-size:22px;font-weight:700;color:var(--gold);}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:28px;padding:0 8px;}
.podium-item{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;}
.podium-crown{font-size:28px;margin-bottom:4px;}
.podium-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 6px;border:3px solid;}
.podium-avatar.gold{background:linear-gradient(135deg,#f1c40f,#e67e22);border-color:#f1c40f;color:#1B4D2E;}
.podium-avatar.silver{background:linear-gradient(135deg,#bdc3c7,#95a5a6);border-color:#bdc3c7;color:#1B4D2E;}
.podium-avatar.bronze{background:linear-gradient(135deg,#e67e22,#d35400);border-color:#e67e22;color:#fff;}
.podium-name{font-size:11px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3;}
.podium-id{font-size:9px;color:var(--muted);margin-bottom:2px;}
.podium-points{font-size:13px;font-weight:700;color:var(--gold);}
.podium-base{border-radius:8px 8px 0 0;width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Display',serif;font-size:20px;font-weight:700;}
.podium-base.gold{background:linear-gradient(135deg,#f1c40f33,#e67e2222);border:1px solid #f1c40f44;height:64px;color:#B7950B;}
.podium-base.silver{background:linear-gradient(135deg,#bdc3c733,#95a5a622);border:1px solid #bdc3c744;height:48px;color:#707B7C;}
.podium-base.bronze{background:linear-gradient(135deg,#e67e2233,#d3540022);border:1px solid #e67e2244;height:36px;color:#e67e22;}
.rank-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;}
.rank-num{font-size:18px;font-weight:700;color:var(--muted);min-width:28px;text-align:center;}
.rank-info{flex:1;}
.rank-name{font-size:14px;font-weight:600;color:var(--text);}
.rank-id{font-size:11px;color:var(--muted);}
.rank-points{font-size:16px;font-weight:700;color:var(--gold);text-align:right;}
.rank-pts-label{font-size:10px;color:var(--muted);text-align:right;}
.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:12px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">🏆 Leaderboard</div>
    <div class="header-sub">Vadodara Mahjong League</div>
  </div>
  <a href="/index.html">← Home</a>
</div>

<div class="main">
  <div class="cat-tabs">
    <button class="cat-tab active" onclick="switchCat('traditional',this)">🀄 Traditional</button>
    <button class="cat-tab" onclick="switchCat('taiwanese',this)">🏆 Taiwanese</button>
  </div>

  <div id="lb-loading" class="loading"><div class="spinner"></div>Loading leaderboard...</div>

  <div id="lb-content" style="display:none;">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-number" id="stat-players">-</div><div class="stat-label">Players</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-top">-</div><div class="stat-label">Top Points</div></div>
    </div>
    <div id="podium-section"></div>
    <div class="section-label" id="rest-label" style="display:none;">Other Players</div>
    <div id="rest-section"></div>
  </div>

  <div id="lb-empty" class="empty-state" style="display:none;">
    <div class="empty-icon">🏆</div>
    <p>No confirmed matches yet.<br/>Rankings will appear here once matches are logged and confirmed.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/vml-common.js"></script>
<script>
var currentCat = 'traditional';

window.addEventListener('DOMContentLoaded', function () { loadLeaderboard(); });

function switchCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  loadLeaderboard();
}

async function loadLeaderboard() {
  document.getElementById('lb-loading').style.display = 'block';
  document.getElementById('lb-content').style.display = 'none';
  document.getElementById('lb-empty').style.display = 'none';

  try {
    var { data, error } = await vmlClient.rpc('vml_public_leaderboard', { p_category: currentCat });
    if (error) throw error;

    var rows = data || [];
    if (!rows.length) {
      document.getElementById('lb-loading').style.display = 'none';
      document.getElementById('lb-empty').style.display = 'block';
      return;
    }

    document.getElementById('stat-players').textContent = rows.length;
    document.getElementById('stat-top').textContent = rows[0].points;

    var top3 = rows.slice(0, 3);
    var rest = rows.slice(3);
    var podiumOrder = [1, 0, 2];
    var posStyles = [
      { cls: 'silver', crown: '🥈', base: 'silver', label: '2nd' },
      { cls: 'gold', crown: '👑', base: 'gold', label: '1st' },
      { cls: 'bronze', crown: '🥉', base: 'bronze', label: '3rd' }
    ];
    var podiumHtml = '<div class="podium">';
    podiumOrder.forEach(function (playerIdx, posIdx) {
      var p = top3[playerIdx];
      var style = posStyles[posIdx];
      if (!p) {
        podiumHtml += '<div class="podium-item"><div class="podium-base ' + style.base + '">' + style.label + '</div></div>';
        return;
      }
      var initials = p.name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
      podiumHtml += '<div class="podium-item">'
        + '<div class="podium-crown">' + style.crown + '</div>'
        + '<div class="podium-avatar ' + style.cls + '">' + initials + '</div>'
        + '<div class="podium-name">' + p.name + '</div>'
        + '<div class="podium-id">' + p.member_id + '</div>'
        + '<div class="podium-points">' + p.points + ' pts</div>'
        + '<div class="podium-base ' + style.base + '">' + style.label + '</div>'
        + '</div>';
    });
    podiumHtml += '</div>';
    document.getElementById('podium-section').innerHTML = podiumHtml;

    if (rest.length) {
      document.getElementById('rest-label').style.display = 'block';
      document.getElementById('rest-section').innerHTML = rest.map(function (p, i) {
        return '<div class="rank-card">'
          + '<div class="rank-num">' + (i + 4) + '</div>'
          + '<div class="rank-info"><div class="rank-name">' + p.name + '</div><div class="rank-id">' + p.member_id + '</div></div>'
          + '<div><div class="rank-points">' + p.points + '</div><div class="rank-pts-label">pts</div></div>'
          + '</div>';
      }).join('');
    } else {
      document.getElementById('rest-label').style.display = 'none';
      document.getElementById('rest-section').innerHTML = '';
    }

    document.getElementById('lb-loading').style.display = 'none';
    document.getElementById('lb-content').style.display = 'block';

  } catch (e) {
    document.getElementById('lb-loading').style.display = 'none';
    document.getElementById('lb-empty').style.display = 'block';
  }
}
</script>
</body>
</html>
