<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Vadodara Mahjong League</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#EAF4EA" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4EA;--surface:#F5FAF6;--card:#FFFFFF;--border:#D7E8DA;--gold:#2E9E60;--text:#1B4D2E;--muted:#5B6B5B;--radius:12px;--red:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-family:'Noto Serif Display',serif;font-size:18px;color:var(--gold);}
.header a{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:6px;font-size:11px;text-decoration:none;}
.main{max-width:420px;margin:0 auto;padding:24px 16px 80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.card p.hint{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;margin-bottom:14px;}
.btn{display:block;width:100%;padding:14px;border-radius:10px;font-weight:600;font-size:15px;text-align:center;border:none;cursor:pointer;font-family:'Inter',sans-serif;background:var(--gold);color:#fff;}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.msg{font-size:13px;margin-top:10px;padding:10px;border-radius:8px;}
.msg.error{background:#FBEAEA;color:var(--red);}
.msg.success{background:#E3F5E8;color:#1E7A46;}
.links{text-align:center;margin-top:16px;font-size:13px;}
.links a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title"><img src="ttml-logo.png" alt="TTML" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px;">Reset Password</div>
  <a href="index.html">← Home</a>
</div>

<div class="main">

  <div class="card" id="request-card">
    <p class="hint">Enter the email you registered with — we'll send you a link to set a new password.</p>
    <label>Email</label>
    <input type="email" id="rp-email" placeholder="you@example.com">
    <button class="btn" id="request-btn" onclick="sendResetLink()">Send Reset Link</button>
    <div id="request-msg"></div>
  </div>

  <div class="card" id="new-pw-card" style="display:none;">
    <p class="hint">Choose a new password for your account.</p>
    <label>New Password</label>
    <input type="password" id="rp-new-password" placeholder="At least 6 characters">
    <button class="btn" id="update-btn" onclick="updatePassword()">Set New Password</button>
    <div id="update-msg"></div>
  </div>

  <div class="links"><a href="login.html">← Back to login</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/vml-common.js"></script>
<script>
function showMsg(elId, text, type) {
  document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
}

// Supabase's password-recovery link lands back on this exact page with a
// PASSWORD_RECOVERY auth event (and a temporary recovery session already
// set up by supabase-js from the URL hash) -- switch to the "set new
// password" card when that fires, instead of the "send me a link" form.
window.addEventListener('DOMContentLoaded', function () {
  vmlClient.auth.onAuthStateChange(function (event) {
    if (event === 'PASSWORD_RECOVERY') {
      document.getElementById('request-card').style.display = 'none';
      document.getElementById('new-pw-card').style.display = 'block';
    }
  });
});

async function sendResetLink() {
  var email = document.getElementById('rp-email').value.trim();
  if (!email) { showMsg('request-msg', 'Enter your email address.', 'error'); return; }

  document.getElementById('request-btn').disabled = true;
  var { error } = await vmlClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  document.getElementById('request-btn').disabled = false;

  if (error) { showMsg('request-msg', error.message, 'error'); return; }
  showMsg('request-msg', '✅ If that email is registered, a reset link has been sent. Check your inbox (and spam folder).', 'success');
}

async function updatePassword() {
  var pw = document.getElementById('rp-new-password').value;
  if (!pw || pw.length < 6) { showMsg('update-msg', 'Password must be at least 6 characters.', 'error'); return; }

  document.getElementById('update-btn').disabled = true;
  var { error } = await vmlClient.auth.updateUser({ password: pw });
  document.getElementById('update-btn').disabled = false;

  if (error) { showMsg('update-msg', error.message, 'error'); return; }
  showMsg('update-msg', '✅ Password updated! Redirecting you to log in...', 'success');
  setTimeout(function () { window.location.href = 'login.html'; }, 2000);
}
</script>
</body>
</html>
